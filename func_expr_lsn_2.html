<html>
    <head><title>Odd or Even?</title></head>
    <body>
        <script>
            let oddoreven = function(number) {
                if (number % 2 == 0){
                    document.write("The number is even.");
                } else {
                    document.write("The number is odd");
                }
            }

            let number = prompt("Number: ");
            oddoreven(number);
        </script>
    </body>
</html>
